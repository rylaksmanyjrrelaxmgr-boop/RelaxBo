services:
  - type: web
    name: relaxbo-rsns
    env: python
    plan: starter
    buildCommand: apt-get update -qq && apt-get install -y -qq tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng tesseract-ocr-fas tesseract-ocr-rus libzbar0 ffmpeg && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ═══════════════════════════════════════════════════════
      # Core
      # ═══════════════════════════════════════════════════════
      - key: BOT_TOKEN
        sync: false
      - key: MAIN_ADMIN_ID
        sync: false
      - key: BOT_NAME
        value: ريلاكس مانيجر
      - key: BOT_USERNAME
        value: Reelaaaxbot
      - key: MAX_FILE_SIZE
        value: "20971520"
      - key: PORT
        value: "10000"
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: LOG_LEVEL
        value: INFO

      # ═══════════════════════════════════════════════════════
      # Multi-Layer Detection — 15 طبقة
      # ═══════════════════════════════════════════════════════
      - key: MULTILAYER_ENABLED
        value: "1"

      # ─── الطبقات الأساسية (7) ───
      - key: TEXT_LAYER_ENABLED
        value: "1"
      - key: OCR_LAYER_ENABLED
        value: "1"
      - key: AUDIO_LAYER_ENABLED
        value: "1"
      - key: URL_LAYER_ENABLED
        value: "1"
      - key: METADATA_LAYER_ENABLED
        value: "1"
      - key: OBFUSCATION_LAYER_ENABLED
        value: "1"
      - key: BEHAVIORAL_LAYER_ENABLED
        value: "1"

      # ─── الطبقات المتقدمة (8) ───
      - key: VIDEO_LAYER_ENABLED
        value: "1"
      - key: NSFW_LAYER_ENABLED
        value: "1"
      - key: STICKER_LAYER_ENABLED
        value: "1"
      - key: REACTIONS_LAYER_ENABLED
        value: "1"
      - key: CONTEXT_LAYER_ENABLED
        value: "1"
      - key: CIPHER_LAYER_ENABLED
        value: "1"
      - key: STEGO_LAYER_ENABLED
        value: "1"
      - key: DOMAIN_REP_LAYER_ENABLED
        value: "1"

      # ─── NSFW: cloud فقط (بدون torch) ───
      - key: NSFW_MODEL_ENABLED
        value: "0"
      - key: SIGHTENGINE_API_USER
        sync: false
      - key: SIGHTENGINE_API_SECRET
        sync: false

      # ─── Layer 1: OCR ───
      - key: OCR_LANGUAGES
        value: ara+eng+fas+rus

      # ─── Layer 2: Audio ───
      - key: AUDIO_USE_WHISPER
        value: "0"

      # ─── Layer 3: URL Enrichment ───
      - key: URL_ENRICH_ENABLED
        value: "1"
      - key: WHOIS_ENABLED
        value: "1"
      - key: URL_EXPAND_TIMEOUT
        value: "5"
      - key: URL_ENRICH_MAX_URLS
        value: "5"
      - key: SAFE_BROWSING_API_KEY
        sync: false

      # ─── Debug (معطّل في الإنتاج) ───
      - key: DEBUG_DIAG
        value: "0"
      - key: DEBUG_SPAM
        value: "0"
      - key: DIAG_INCOMING
        value: "0"
      - key: ANTIFLOOD_ENABLED
        value: "1"
      - key: SLOW_MODE_AUTO
        value: "1"
      - key: FORCE_DELETE_BUTTON_LINKS
        value: "1"
      - key: FORCE_DELETE_POSTBOT_FORWARDS
        value: "1"
      - key: BAN_ADD_RATE_LIMIT
        value: "1"